name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bronze-tests:
    name: Bronze unit tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      
      - name: Run pytest
        run: pytest -q

  dbt-test:
    name: dbt test
    runs-on: ubuntu-latest
    needs: bronze-tests
    env:
      DBT_PROFILES_DIR: ${{ github.workspace }}/dbt
    steps:
      - uses: actions/checkout@v5
      
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      
      - name: Build Bronze layer from synthetic data
        run: python -m tests.build_ci_warehouse --out .ci/warehouse.duckdb
      
      - name: dbt deps
        working-directory: dbt
        run: dbt deps
      
      - name: dbt debug
        working-directory: dbt
        run: dbt debug
      
      - name: dbt run (build models)
        working-directory: dbt
        run: dbt run --target ci
      
      - name: dbt test
        working-directory: dbt
        run: dbt test --target ci
      
      - name: Upload dbt logs on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: dbt-logs
          path: dbt/logs/
